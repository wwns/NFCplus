name: Build Windows Executable

on:
  push:
    branches: ["main", "master"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install package and build dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev,build]"

      - name: Run unit tests
        run: pytest -v

      - name: Build NFCplus.exe with PyInstaller
        run: |
          pyinstaller --noconfirm --clean --onefile --windowed --collect-all customtkinter --name NFCplus --paths src src/nfcplus/app.py

      - name: Upload NFCplus-Windows-x64 artifact
        uses: actions/upload-artifact@v4
        with:
          name: NFCplus-Windows-x64
          path: dist/NFCplus.exe
          if-no-files-found: error
