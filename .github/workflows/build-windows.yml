name: Build Windows Executable & Release

on:
  push:
    branches: ["main", "master"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install package and build dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev,build]"

      - name: Run unit tests
        run: pytest -v

      - name: Build NFCplus.exe with PyInstaller
        run: |
          pyinstaller --noconfirm --clean --onefile --windowed --icon assets/nfcplus.ico --add-data "assets/nfcplus.ico;assets" --add-data "assets/nfcplus.png;assets" --collect-all customtkinter --name NFCplus --paths src src/nfcplus/app.py

      - name: Verify PE icon resources in NFCplus.exe
        run: |
          python -c "import pefile; pe = pefile.PE('dist/NFCplus.exe'); types = [e.id for e in pe.DIRECTORY_ENTRY_RESOURCE.entries]; print('PE resource types:', types); assert 14 in types and 3 in types, f'Missing icon resources: {types}'"

      - name: Build NSIS Installer (NFCplus-Setup)
        shell: pwsh
        run: |
          if (-not (Get-Command makensis -ErrorAction SilentlyContinue)) {
            choco install nsis -y --no-progress
            $env:PATH += ";C:\Program Files (x86)\NSIS"
          }
          $ver = if ($env:GITHUB_REF_NAME -like "v*") { $env:GITHUB_REF_NAME.Substring(1) } else { "0.1.0" }
          makensis "-DVERSION=$ver" installer/nfcplus.nsi

      - name: Package NFCplus-Windows-x64.zip
        shell: pwsh
        run: |
          Compress-Archive -Path dist/NFCplus.exe, run_windows.bat, diag_windows.bat, README.md -DestinationPath NFCplus-Windows-x64.zip -Force

      - name: Upload NFCplus-Windows-x64 artifact
        uses: actions/upload-artifact@v4
        with:
          name: NFCplus-Windows-x64
          path: |
            dist/NFCplus.exe
            dist/NFCplus-Setup-v*.exe
            NFCplus-Windows-x64.zip
          if-no-files-found: error

      - name: Update repository About description and topics (best-effort)
        if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          gh api -X PATCH "repos/${GITHUB_REPOSITORY}" \
            -f description="Czytelny klient GUI/CLI USB HID oraz nieinwazyjny audytor bezpieczeństwa kart RFID/NFC (Mifare Classic, NTAG/NDEF, 125 kHz EM4100/T5577, HID Prox, ISO 14443-4 APDU) dla czytników wCopy / Xixei (Windows & Linux)."
          gh api -X PUT "repos/${GITHUB_REPOSITORY}/topics" \
            -H "Accept: application/vnd.github+json" \
            --input - <<'EOF'
          {
            "names": [
              "nfc",
              "rfid",
              "mifare",
              "ntag",
              "ndef",
              "em4100",
              "t5577",
              "hid-prox",
              "usb-hid",
              "security-audit",
              "customtkinter",
              "python",
              "windows",
              "linux"
            ]
          }
          EOF

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          if [[ "${GITHUB_REF_NAME}" == v* ]]; then
            REL_TAG="${GITHUB_REF_NAME}"
          else
            REL_TAG="v0.1.0"
          fi
          SETUP_EXE=$(ls dist/NFCplus-Setup-v*.exe | head -n 1)
          cat <<'EOF' > RELEASE_NOTES.md
          ## NFCplus — Klient GUI/CLI oraz Audytor Bezpieczeństwa Kart RFID/NFC (Windows & Linux)

          Czytelny, działający w 100% lokalnie (offline) klient okienkowy (**CustomTkinter**, skórka **Ciemna / Jasna**) oraz narzędzie wiersza poleceń (`nfcplus`) dla czytników USB HID z rodziny **wCopy / Xixei / NFC Pro** (`0416:b030`, `0416:b031`, `2518:6022`, `2518:6018`).

          ### Pobieranie na Windows (x64)
          - **`NFCplus-Setup-v*.exe`** — klasyczny instalator Windows (Menu Start, Pulpit, deinstalator, ikona aplikacji).
          - **`NFCplus.exe`** — samodzielny jednoplikowy program przenośny (portable) dla Windows 10/11 x64.
          - **`NFCplus-Windows-x64.zip`** — paczka zawierająca `NFCplus.exe`, skrypty pomocnicze (`run_windows.bat`, `diag_windows.bat`) oraz `README.md`.

          ### Najważniejsze funkcje
          1. **Natywna obsługa USB HID bez zewnętrznych sterowników** (Win32 HID na Windowsie, `/dev/hidraw*` + utwardzone `udev` na Linuksie).
          2. **Skanowanie jedno- i wieloczęstotliwościowe** (`13.56 MHz` ISO 14443-A + `125 kHz` EM4100/T5577 i HID Prox).
          3. **MIFARE Classic:** odczyt, zapis zrzutów `.dump`, zapis tekstu przez bloki danych, formatowanie, siatka kluczy `A/B`, import `.txt/.dic`, analizator `Access Bits` / `Value Block`, eksport JSON.
          4. **NTAG / Ultralight & NDEF:** `GET_VERSION`, `PWD_AUTH`, dekodowanie i zapis rekordów NDEF (`URI` / `Text`).
          5. **125 kHz T5577 & konwerter formatów LF**, **Konsola APDU**, **Porównywarka `.dump` obok siebie**.
          6. **Nieinwazyjny Audyt Bezpieczeństwa Karty (`Read-Only`)** z maskowaniem kluczy i eksportem HTML/Markdown/JSON.
          EOF

          if gh release view "${REL_TAG}" >/dev/null 2>&1; then
            gh release upload "${REL_TAG}" dist/NFCplus.exe "${SETUP_EXE}" NFCplus-Windows-x64.zip --clobber
            gh release edit "${REL_TAG}" \
              --title "NFCplus ${REL_TAG} — Klient i audytor NFC / Mifare (Windows & Linux)" \
              --notes-file RELEASE_NOTES.md
          else
            gh release create "${REL_TAG}" dist/NFCplus.exe "${SETUP_EXE}" NFCplus-Windows-x64.zip \
              --title "NFCplus ${REL_TAG} — Klient i audytor NFC / Mifare (Windows & Linux)" \
              --notes-file RELEASE_NOTES.md
          fi
