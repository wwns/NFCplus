[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "nfcplus"
version = "0.1.3"
description = "Czytelny, wieloplatformowy klient i sterownik USB HID dla czytników NFC/Mifare (wCopy / Xixei / NSR106)"
readme = "docs/protocol.md"
requires-python = ">=3.10"
dependencies = [
    "customtkinter>=5.2",
]

[project.optional-dependencies]
hid = ["hidapi>=0.14.0"]
build = ["pyinstaller>=6.0", "pillow>=10.0"]
dev = ["pytest>=8.0"]

[project.scripts]
nfcplus = "nfcplus.cli:main"

[project.gui-scripts]
nfcplus-gui = "nfcplus.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
